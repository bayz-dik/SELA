name: Build SELA Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Restore persistent keystores (SHA-1 terdaftar di Firebase)
        run: |
          echo "${{ secrets.SELA_RELEASE_KEYSTORE_B64 }}" | base64 -d > android/app/sela-release.keystore
          echo "${{ secrets.SELA_DEBUG_KEYSTORE_B64 }}" | base64 -d > android/app/sela-debug.keystore
          echo "Keystore dipulihkan (persistent, SHA-1 stabil untuk Firebase)"

      - name: Restore google-services.json & Web Client ID
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 -d > android/app/google-services.json
          echo "google.webClientId=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" > android/local.properties
          echo "google-services.json & webClientId dipulihkan dari secrets"

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon \
            -Psela.keystore.password="${{ secrets.SELA_KEYSTORE_PASSWORD }}" \
            -Psela.key.alias="${{ secrets.SELA_KEY_ALIAS }}" \
            -Psela.key.password="${{ secrets.SELA_KEY_PASSWORD }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sela-apk
          path: android/app/build/outputs/apk/release/*.apk
