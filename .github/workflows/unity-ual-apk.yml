name: Build SELA Unity APK

on:
  workflow_dispatch:

jobs:
  export-unity:
    name: Export Unity Library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export unityLibrary
        uses: game-ci/unity-builder@v6
        continue-on-error: true
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          projectPath: unity-project
          buildMethod: SelaCiBuild.BuildAndroidLibrary
          buildsPath: unity-export-out
          androidTargetSdkVersion: '35'
          customParameters: '-exportPath /github/workspace/unity-export-out'

      - name: Verify unityLibrary exists
        run: |
          echo "Checking for unityLibrary..."
          ls -la unity-export-out/ || echo "unity-export-out not found"
          ls -la unity-export-out/unityLibrary/ 2>/dev/null | head -10 || echo "unityLibrary not found"
          if [ -d "unity-export-out/unityLibrary" ]; then
            echo "SUCCESS: unityLibrary found"
            find unity-export-out/unityLibrary -type f | wc -l
          else
            echo "FAILED: unityLibrary not found"
            exit 1
          fi

      - name: Upload unityLibrary artifact
        uses: actions/upload-artifact@v4
        with:
          name: unityLibrary
          path: unity-export-out/**/unityLibrary

  build-apk:
    name: Build Android APK
    needs: export-unity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download unityLibrary
        uses: actions/download-artifact@v4
        with:
          name: unityLibrary
          path: android/unity-export
          # Artifact berisi folder unityLibrary/, jadi download ke parent-nya
          # agar hasilnya android/unity-export/unityLibrary/ (tidak double-nested)

      - name: Replace unityLibrary build.gradle
        run: |
          cd android/unity-export/unityLibrary
          # Ganti build.gradle Unity dengan versi minimal yang kompatibel.
          # build.gradle asli Unity tidak kompatibel (ndkPath absolut, SDK 36, Java 17,
          # apply from '../shared/...' yang tidak ada).
          cat > build.gradle << 'EOF'
          apply plugin: 'com.android.library'

          android {
              namespace "com.unity3d.player"
              compileSdk 35

              defaultConfig {
                  minSdk 26
                  consumerProguardFiles "proguard-unity.txt"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_21
                  targetCompatibility JavaVersion.VERSION_21
              }
          }

          dependencies {
              implementation fileTree(dir: 'libs', include: ['*.jar'])
              implementation 'androidx.games:games-frame-pacing:2.1.2'
          }
          EOF
          echo "--- build.gradle replaced ---"
          cat build.gradle

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls $ANDROID_HOME || echo "ANDROID_HOME not set, checking default..."
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          ls $ANDROID_HOME/cmdline-tools/ || echo "cmdline-tools check done"

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/sela-release.keystore \
            -alias sela \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ secrets.SELA_KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.SELA_KEY_PASSWORD }}" \
            -dname "CN=SELA, OU=SELA, O=SELA, L=Jakarta, ST=Jakarta, C=ID"
          ls -la android/app/sela-release.keystore

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon \
            -Psela.keystore.password="${{ secrets.SELA_KEYSTORE_PASSWORD }}" \
            -Psela.key.alias="sela" \
            -Psela.key.password="${{ secrets.SELA_KEY_PASSWORD }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sela-apk
          path: android/app/build/outputs/apk/release/*.apk
