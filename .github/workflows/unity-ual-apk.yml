name: Build SELA Unity APK

on:
  workflow_dispatch:

jobs:
  export-unity:
    name: Export Unity Library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export unityLibrary
        uses: game-ci/unity-builder@v6
        continue-on-error: true
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          projectPath: unity-project
          buildMethod: SelaCiBuild.BuildAndroidLibrary
          buildsPath: unity-export-out
          androidTargetSdkVersion: '35'
          customParameters: '-exportPath /github/workspace/unity-export-out'

      - name: Verify unityLibrary exists
        run: |
          echo "Checking for unityLibrary..."
          ls -la unity-export-out/ || echo "unity-export-out not found"
          ls -la unity-export-out/unityLibrary/ 2>/dev/null | head -10 || echo "unityLibrary not found"
          if [ -d "unity-export-out/unityLibrary" ]; then
            echo "SUCCESS: unityLibrary found"
            find unity-export-out/unityLibrary -type f | wc -l
          else
            echo "FAILED: unityLibrary not found"
            exit 1
          fi

      - name: Upload unityLibrary artifact
        uses: actions/upload-artifact@v4
        with:
          name: unityLibrary
          path: unity-export-out/**/unityLibrary

  build-apk:
    name: Build Android APK
    needs: export-unity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download unityLibrary
        uses: actions/download-artifact@v4
        with:
          name: unityLibrary
          path: android/unity-export/unityLibrary

      - name: Patch unityLibrary build.gradle
        run: |
          cd android/unity-export/unityLibrary
          # Hapus ndkPath yang nggak ada di runner, samakan SDK & Java
          sed -i 's|ndkPath.*|// ndkPath removed for CI|' build.gradle
          sed -i 's/compileSdk 36/compileSdk 35/' build.gradle
          sed -i 's/targetSdk 36/targetSdk 35/' build.gradle
          sed -i 's/buildToolsVersion "36.0.0"/buildToolsVersion "35.0.0"/' build.gradle
          sed -i 's/JavaVersion.VERSION_17/JavaVersion.VERSION_21/g' build.gradle
          # Hapus apply dari shared yang mungkin nggak kompatibel
          sed -i "s|apply from: '../shared/keepUnitySymbols.gradle'|// removed|" build.gradle
          sed -i "s|apply from: '../shared/common.gradle'|// removed|" build.gradle
          head -20 build.gradle

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls $ANDROID_HOME || echo "ANDROID_HOME not set, checking default..."
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          ls $ANDROID_HOME/cmdline-tools/ || echo "cmdline-tools check done"

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/sela-release.keystore \
            -alias sela \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ secrets.SELA_KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.SELA_KEY_PASSWORD }}" \
            -dname "CN=SELA, OU=SELA, O=SELA, L=Jakarta, ST=Jakarta, C=ID"
          ls -la android/app/sela-release.keystore

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon \
            -Psela.keystore.password="${{ secrets.SELA_KEYSTORE_PASSWORD }}" \
            -Psela.key.alias="sela" \
            -Psela.key.password="${{ secrets.SELA_KEY_PASSWORD }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sela-apk
          path: android/app/build/outputs/apk/release/*.apk
