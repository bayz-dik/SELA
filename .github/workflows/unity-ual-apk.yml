name: Build SELA Unity APK

on:
  workflow_dispatch:

jobs:
  export-unity:
    name: Export Unity Library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export unityLibrary
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          projectPath: unity-project
          androidExportType: androidStudioProject
          buildMethod: SelaCiBuild.BuildAndroidLibrary
          buildsPath: unity-export-out
          androidTargetSdkVersion: '35'
          customParameters: '-exportPath /github/workspace/unity-export-out'

      - name: Upload unityLibrary artifact
        uses: actions/upload-artifact@v4
        with:
          name: unityLibrary
          path: unity-export-out/**/unityLibrary

  build-apk:
    name: Build Android APK
    needs: export-unity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download unityLibrary
        uses: actions/download-artifact@v4
        with:
          name: unityLibrary
          path: android/unity-export/unityLibrary

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sela-apk
          path: android/app/build/outputs/apk/release/*.apk
