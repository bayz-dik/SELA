name: Build SELA Unity APK

on:
  workflow_dispatch:

# Hardening (audit #26a): prinsip least-privilege di level workflow.
# checkout -> contents: read; upload/download-artifact -> actions: read/write.
permissions:
  contents: read
  actions: write

jobs:
  export-unity:
    name: Export Unity Library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Export unityLibrary
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
        continue-on-error: true
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          projectPath: unity-project
          buildMethod: SelaCiBuild.BuildAndroidLibrary
          buildsPath: unity-export-out
          androidTargetSdkVersion: '35'
          customParameters: '-exportPath /github/workspace/unity-export-out'

      - name: Verify unityLibrary exists
        run: |
          echo "Checking for unityLibrary..."
          ls -la unity-export-out/ || echo "unity-export-out not found"
          ls -la unity-export-out/unityLibrary/ 2>/dev/null | head -10 || echo "unityLibrary not found"
          if [ -d "unity-export-out/unityLibrary" ]; then
            echo "SUCCESS: unityLibrary found"
            find unity-export-out/unityLibrary -type f | wc -l
          else
            echo "FAILED: unityLibrary not found"
            exit 1
          fi

      - name: Upload unityLibrary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unityLibrary
          path: unity-export-out/**/unityLibrary

  build-apk:
    name: Build Android APK
    needs: export-unity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download unityLibrary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unityLibrary
          path: android/unity-export
          # Artifact berisi folder unityLibrary/, jadi download ke parent-nya
          # agar hasilnya android/unity-export/unityLibrary/ (tidak double-nested)

      - name: Replace unityLibrary build.gradle
        run: |
          cd android/unity-export/unityLibrary
          # Ganti build.gradle Unity dengan versi minimal yang kompatibel.
          # build.gradle asli Unity tidak kompatibel (ndkPath absolut, SDK 36, Java 17,
          # apply from '../shared/...' yang tidak ada).
          # Guard (audit #26c): hanya referensikan proguard-unity.txt jika file-nya ada,
          # agar build tidak gagal total kalau file hilang dari hasil export Unity.
          if [ -f "proguard-unity.txt" ]; then
            echo "proguard-unity.txt ditemukan, pakai consumerProguardFiles."
            PROGUARD_LINE='                  consumerProguardFiles "proguard-unity.txt"'
          else
            echo "WARNING: proguard-unity.txt tidak ditemukan - build lanjut tanpa consumer ProGuard rules."
            PROGUARD_LINE=''
          fi
          cat > build.gradle << EOF
          apply plugin: 'com.android.library'

          android {
              namespace "com.unity3d.player"
              compileSdk 35

              defaultConfig {
                  minSdk 26
          $PROGUARD_LINE
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_21
                  targetCompatibility JavaVersion.VERSION_21
              }
          }

          dependencies {
              implementation fileTree(dir: 'libs', include: ['*.jar'])
              implementation 'androidx.games:games-frame-pacing:2.1.2'
          }
          EOF
          echo "--- build.gradle replaced ---"
          cat build.gradle

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls $ANDROID_HOME || echo "ANDROID_HOME not set, checking default..."
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          ls $ANDROID_HOME/cmdline-tools/ || echo "cmdline-tools check done"

      - name: Download existing keystore (reuse jika ada)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: sela-keystore
          path: android/app/

      - name: Generate keystore (hanya jika belum ada)
        run: |
          if [ -f "android/app/sela-release.keystore" ]; then
            echo "Keystore sudah ada, pakai yang lama (signature konsisten)."
            ls -la android/app/sela-release.keystore
          else
            echo "Keystore belum ada, generate baru."
            keytool -genkeypair -v \
              -keystore android/app/sela-release.keystore \
              -alias sela \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${{ secrets.SELA_KEYSTORE_PASSWORD }}" \
              -keypass "${{ secrets.SELA_KEY_PASSWORD }}" \
              -dname "CN=SELA, OU=SELA, O=SELA, L=Jakarta, ST=Jakarta, C=ID"
            ls -la android/app/sela-release.keystore
          fi

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon \
            -Psela.keystore.password="${{ secrets.SELA_KEYSTORE_PASSWORD }}" \
            -Psela.key.alias="sela" \
            -Psela.key.password="${{ secrets.SELA_KEY_PASSWORD }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sela-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload keystore artifact (untuk reuse build berikutnya)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sela-keystore
          path: android/app/sela-release.keystore
          overwrite: true
