# GitHub Actions — Build unityLibrary (Unity as a Library) untuk SELA.
#
# STRATEGI AKTIF (per Okt 2026): game-ci v6 + aktivasi Personal via email/password.
# - TIDAK butuh file .ulf (aktivasi manual .alf -> .ulf untuk Personal sudah mati)
# - Secrets yang dibutuhkan: UNITY_EMAIL, UNITY_PASSWORD
# - Workflow produksi ada di repo: .github/workflows/unity-ual-apk.yml
#   (2 jobs: export-unity via game-ci, lalu build-apk via Gradle)
#
# File ini adalah referensi/dokumentasi. Untuk build UAL saja:
# gunakan buildMethod: SelaCiBuild.BuildAndroidLibrary

name: Build unityLibrary (UAL)

on:
  workflow_dispatch:

env:
  UNITY_VERSION: 6000.0.47f1

jobs:
  build-ual:
    name: Export unityLibrary (Android)
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: unity-project/Library
          key: unity-library-${{ env.UNITY_VERSION }}-${{ hashFiles('unity-project/Packages/manifest.json') }}
          restore-keys: |
            unity-library-${{ env.UNITY_VERSION }}-

      - name: Build unityLibrary
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity-project
          targetPlatform: Android
          androidExportType: androidStudioProject
          androidSymbolType: none
          buildMethod: SelaCiBuild.BuildAndroidLibrary
          customParameters: -exportPath ${{ github.workspace }}/unity-export

      - name: Upload unityLibrary
        uses: actions/upload-artifact@v4
        with:
          name: unityLibrary
          path: unity-export/unityLibrary
          retention-days: 30

      - name: Report size
        run: |
          echo "### unityLibrary size" >> $GITHUB_STEP_SUMMARY
          du -sh unity-export/unityLibrary >> $GITHUB_STEP_SUMMARY
